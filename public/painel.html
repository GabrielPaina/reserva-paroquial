<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel | Reserva Paroquial Nossa Senhora das Vitórias</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Reserva Paroquial Nossa Senhora das Vitórias</h1>
        <p>Painel de reservas</p>
    </header>

    <main>

        <section>
            <h2>Nova reserva</h2>

            <form id="formReserva">

                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Nome completo"
                    required
                >

                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(41) 99999-9999"
                >

                <label for="data_reserva">Data</label>
                <input
                    type="date"
                    id="data_reserva"
                    name="data_reserva"
                    required
                >

                <label for="horario">Horário</label>
                <input
                    type="time"
                    id="horario"
                    name="horario"
                    required
                >

                <label for="quantidade_pessoas">
                    Quantidade de pessoas
                </label>

                <input
                    type="number"
                    id="quantidade_pessoas"
                    name="quantidade_pessoas"
                    min="1"
                    required
                >

                <label for="observacao">Observação</label>

                <textarea
                    id="observacao"
                    name="observacao"
                    placeholder="Informações adicionais"
                ></textarea>

                <button type="submit">
                    Solicitar reserva
                </button>

            </form>

            <div id="mensagem"></div>

        </section>

    </main>

    <script src="js/painel.js"></script>

</body>

</html>
